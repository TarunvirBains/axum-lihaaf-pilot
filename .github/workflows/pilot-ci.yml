name: pilot-ci (trybuild vs lihaaf)
on:
  push:
    branches: [lihaaf-converted]
  workflow_dispatch:
    inputs:
      mode:
        description: 'benchmark_only or bless_and_benchmark'
        type: choice
        options:
          - benchmark_only
          - bless_and_benchmark
        default: benchmark_only

permissions:
  contents: write

jobs:
  bless:
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'bless_and_benchmark'
    runs-on: ubuntu-latest
    steps:
      - name: checkout lihaaf-converted
        uses: actions/checkout@v6
        with:
          ref: lihaaf-converted
          persist-credentials: true

      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: install lihaaf
        run: cargo install lihaaf --version 0.1.0-beta.9 --locked

      - name: bless lihaaf snapshots
        run: cargo lihaaf --bless --manifest-path axum-macros/Cargo.toml

      - name: commit regenerated snapshots if any
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "no snapshot changes to commit"
          else
            git commit -m "chore: re-bless lihaaf snapshots against lihaaf 0.1.0-beta.9 output"
            git push origin lihaaf-converted
          fi

  benchmark:
    needs: [bless]
    if: always() && (needs.bless.result == 'success' || needs.bless.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, lihaaf-converted]
    steps:
      - name: checkout ${{ matrix.branch }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: install lihaaf (lihaaf-converted only)
        if: matrix.branch == 'lihaaf-converted'
        run: cargo install lihaaf --version 0.1.0-beta.9 --locked

      - name: time fixture suite
        id: bench
        run: |
          set -euo pipefail
          if [ "${{ matrix.branch }}" = "main" ]; then
            CMD="cargo test --package axum-macros"
          else
            CMD="cargo lihaaf --manifest-path axum-macros/Cargo.toml"
          fi
          START=$(date +%s%N)
          /usr/bin/time -o time.txt -v $CMD
          END=$(date +%s%N)
          WALL_MS=$(( (END - START) / 1000000 ))
          PEAK_KB=$(awk '/Maximum resident set size/ {print $NF}' time.txt)
          echo "wall_ms=$WALL_MS" >> "$GITHUB_OUTPUT"
          echo "peak_kb=$PEAK_KB" >> "$GITHUB_OUTPUT"
          printf '{"branch":"%s","wall_ms":%d,"peak_kb":%d}\n' \
            "${{ matrix.branch }}" "$WALL_MS" "$PEAK_KB" > timing.json

      - name: upload /usr/bin/time output (debug)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: time-debug-${{ matrix.branch }}
          path: time.txt
          if-no-files-found: ignore

      - name: upload timing JSON
        uses: actions/upload-artifact@v6
        with:
          name: timing-${{ matrix.branch }}
          path: timing.json

      - name: write step summary
        run: |
          echo "## ${{ matrix.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "wall_ms: ${{ steps.bench.outputs.wall_ms }}" >> "$GITHUB_STEP_SUMMARY"
          echo "peak_kb: ${{ steps.bench.outputs.peak_kb }}" >> "$GITHUB_STEP_SUMMARY"
